name: GNN expressivity lab CI

on:
  push:
    paths:
      - "gnn_expressivity_lab/**"
      - ".github/workflows/gnn-expressivity.yml"
  pull_request:
    paths:
      - "gnn_expressivity_lab/**"
      - ".github/workflows/gnn-expressivity.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e "./gnn_expressivity_lab[dev]"
      - name: Run unit tests
        run: pytest -q gnn_expressivity_lab/tests
      - name: Run sparse-model smoke experiment
        run: gnn-sparse-experiment --epochs 2 --seeds 11 --output /tmp/gnn-sparse-smoke.json
      - name: Validate generated JSON
        run: python -c "import json; json.load(open('/tmp/gnn-sparse-smoke.json'))"
      - name: Check optional benchmark CLI wiring
        run: gnn-benchmark --help
