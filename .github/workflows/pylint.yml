name: Pylint (GNN project)

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GNN project and lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./gnn_expressivity_lab[dev]" pylint
      - name: Check GNN package for pylint errors
        env:
          PYTHONPATH: gnn_expressivity_lab/src
        run: |
          pylint --errors-only gnn_expressivity_lab/src/gnn_expressivity_lab gnn_expressivity_lab/tests
