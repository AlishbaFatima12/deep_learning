[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn-expressivity-lab"
version = "0.1.0"
description = "Reproducible GCN/GIN and 1-WL expressivity experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gnn-expressivity = "gnn_expressivity_lab.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
